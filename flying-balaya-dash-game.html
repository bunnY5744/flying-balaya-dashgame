<!DOCTYPE html><html lang="te"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Balayya Bottle Dash</title>
<style>
:root{--ac:#ffc83d;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:radial-gradient(circle at 50% 30%,#1a2a73,#050a24);color:#fff;font-family:system-ui,-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#w{position:relative;width:100%;height:100%;overflow:hidden}
@media(min-width:700px){#w{height:calc(100% - 28px);width:calc((100dvh - 28px)*.625);max-width:100%;border-radius:18px;box-shadow:0 12px 60px #000c,0 0 0 2px #ffc83d55}}
canvas{width:100%;height:100%;display:block}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px;box-sizing:border-box;background:linear-gradient(#030820ee,#0a1240cc);backdrop-filter:blur(3px)}
#logo{display:flex;flex-direction:column;align-items:center;gap:12px}
#fc{width:92px;height:92px;border-radius:50%;object-fit:cover;border:4px solid var(--ac);box-shadow:0 0 28px #ffc83d88;animation:fl 2.2s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-10px) rotate(4deg)}}
h1{margin:0;font-size:clamp(28px,9vw,40px);line-height:1.05;font-weight:900;letter-spacing:.5px;text-transform:uppercase;background:linear-gradient(#fff3b0,#ffb300);-webkit-background-clip:text;background-clip:text;color:transparent}
h1 span{display:block;font-size:.72em;letter-spacing:3px}
p{margin:0;opacity:.85;font-size:15px}
#b{font-weight:700;color:var(--ac);min-height:20px}
#d{display:none}
#go{background:linear-gradient(#ffd75e,#ff9f1a);color:#1a1100;border:0;border-radius:32px;padding:14px 44px;font-size:22px;font-weight:900;letter-spacing:1px;cursor:pointer;box-shadow:0 6px 0 #a3600a,0 10px 24px #0008;animation:pu 1.4s infinite}
@keyframes pu{50%{transform:scale(1.06)}}
#how{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;font-size:12.5px}
#how span{background:#ffffff18;border-radius:20px;padding:6px 11px}
.over #fc,.over #how{display:none}
.over h1{font-size:clamp(30px,10vw,46px)}
#mb{position:absolute;top:10px;right:10px;width:40px;height:40px;border-radius:50%;border:0;background:#0008;color:#fff;font-size:18px;z-index:4;cursor:pointer}
#bn{position:absolute;left:6%;right:6%;top:5%;background:#000d;border:2px solid var(--ac);border-radius:14px;padding:8px;text-align:center;transform:translateY(-150%);transition:transform .35s;z-index:3;pointer-events:none}
#bn.on{transform:none}#bn img{width:100%;border-radius:10px;display:block}#bn b{display:block;margin-top:6px;color:var(--ac);font-size:18px}
#sc{width:88%;max-width:340px;max-height:34%;object-fit:cover;border-radius:12px;border:3px solid var(--ac);display:none;animation:sk .4s 3}
@keyframes sk{25%{transform:translateX(-9px) rotate(-1.5deg)}75%{transform:translateX(9px) rotate(1.5deg)}}
</style></head><body>
<div id="w"><canvas id="c" width="800" height="1280"></canvas>
<input id="mu" type="checkbox" checked hidden><button id="mb" aria-label="sound">🔊</button>
<div id="ov"><div id="logo"><img id="fc" alt=""><h1 id="t">Balayya<span>Bottle Dash</span></h1></div>
<img id="sc" alt=""><div id="d"></div><p id="s">Tap chesi egaru, bottles ki tagalakunda dhatu!</p><div id="b"></div>
<button id="go">▶ START</button>
<div id="how"><span>👆 Tap / Space</span><span>🍾 Bottles avoid cheyyi</span><span>🏆 Best score</span></div></div>

let H=640;const W=400,GAP=150,R=17,BX=100,SPACING=230,BH=190;

function startMusic(){if(!$('mu').checked)return;

 o.frequency.value=261.6*Math.pow(2,mel[i++%16]/12);g.gain.setValueAtTime(.08,ac.currentTime);
 g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.16);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.17)},170)}catch(e){}}

function hit(cx,cy,rx0,ry0,rx1,ry1){const nx=Math.max(rx0,Math.min(cx,rx1)),ny=Math.max(ry0,Math.min(cy,ry1));return (cx-nx)**2+(cy-ny)**2<(R-4)**2}
function coll(p,bw){const tb=p.gy+GAP/2,bt=p.gy-GAP/2,n=.11*bw,b=.31*bw,k=.28*BH;
 for(let i=0;i<4;i++){const s=tb+i*BH,u=bt-i*BH;
 if(hit(BX,by,p.x-n,s,p.x+n,s+k)||hit(BX,by,p.x-b,s+k,p.x+b,s+BH)||hit(BX,by,p.x-n,u-k,p.x+n,u)||hit(BX,by,p.x-b,u-BH,p.x+b,u-k))return true}return false}
function upd(dt){const bw=BH*bi.width/bi.height||136,sp=2.6+Math.min(score*.05,1.6);

 for(const p of pipes){p.x-=sp*dt;if(!p.p&&p.x<BX){p.p=1;score++}if(coll(p,bw))return die()}

function draw(dt){x.fillStyle=sky;x.fillRect(0,0,W,H);
