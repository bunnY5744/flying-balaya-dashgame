/* audio */
function b64buf(d){const b=atob(d.split(",")[1]),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u.buffer}
let AC=null,songBuf=null,outBuf=null,songSrc=null;
const songEl=new Audio(URL.createObjectURL(new Blob([b64buf(SONG)],{type:"audio/mpeg"})));songEl.loop=true;songEl.preload="auto";
const outEl=new Audio(URL.createObjectURL(new Blob([b64buf(OUT)],{type:"audio/mpeg"})));outEl.preload="auto";
try{const C=window.AudioContext||window.webkitAudioContext;if(C){AC=new C();
 const dec=d=>new Promise((ok,no)=>{const p=AC.decodeAudioData(b64buf(d),ok,no);if(p&&p.catch)p.catch(no)});
 dec(SONG).then(b=>{songBuf=b}).catch(()=>{});dec(OUT).then(b=>{outBuf=b}).catch(()=>{})}}catch(e){AC=null}
function startMusic(){if(!$('mu').checked)return;stopMusic();
 if(AC&&songBuf){try{AC.resume();songSrc=AC.createBufferSource();songSrc.buffer=songBuf;songSrc.loop=true;
  const g=AC.createGain();g.gain.value=1;songSrc.connect(g);g.connect(AC.destination);songSrc.start(0);return}catch(e){songSrc=null}}
 songEl.currentTime=0;songEl.play().catch(()=>{})}
function stopMusic(){if(songSrc){try{songSrc.stop()}catch(e){}songSrc=null}songEl.pause()}
function sayOut(){if(!$('mu').checked)return;
 if(AC&&outBuf){try{AC.resume();const s=AC.createBufferSource();s.buffer=outBuf;s.connect(AC.destination);s.start(0);return}catch(e){}}
 outEl.currentTime=0;outEl.play().catch(()=>{})}

 $('t').textContent=(nb&&score>0?'New Best! ':'Out! ')+score;const sc=$('sc');sc.style.animation='none';sc.offsetWidth;sc.style.animation='';sc.style.display='block';$('s').textContent='';$('b').textContent='Best: '+best;$('go').textContent='↻ RETRY';$('ov').classList.add('over');$('ov').style.display='flex'}
function hit(cx,cy,rx0,ry0,rx1,ry1){const nx=Math.max(rx0,Math.min(cx,rx1)),ny=Math.max(ry0,Math.min(cy,ry1));return (cx-nx)**2+(cy-ny)**2<(R-4)**2}
function coll(p,bw){const tb=p.gy+GAP/2,bt=p.gy-GAP/2,n=.11*bw,b=.31*bw,k=.28*BH;
 for(let i=0;i<4;i++){const s=tb+i*BH,u=bt-i*BH;
 if(hit(BX,by,p.x-n,s,p.x+n,s+k)||hit(BX,by,p.x-b,s+k,p.x+b,s+BH)||hit(BX,by,p.x-n,u-k,p.x+n,u)||hit(BX,by,p.x-b,u-BH,p.x+b,u-k))return true}return false}
function upd(dt){const bw=BH*bi.width/bi.height||136,sp=2.6+Math.min(score*.05,1.6);
 bv+=.45*dt;by+=bv*dt;
 for(const p of pipes){p.x-=sp*dt;if(!p.p&&p.x<BX){p.p=1;score++}if(coll(p,bw))return die()}
 if(pipes[0].x<-120){pipes.shift();pipes.push({x:pipes[pipes.length-1].x+SPACING,gy:rg(),p:0})}
 if(by>H-R||by<R)die()}
const clouds=Array.from({length:7},(_,i)=>({x:i*75,y:30+Math.random()*430,s:.6+Math.random()*.9,v:.25+Math.random()*.35}));
let sky,stars;
function fit(){const w=$('w').clientWidth,h=$('w').clientHeight;if(!w||!h)return;H=Math.max(640,Math.min(900,Math.round(400*h/w)));cv.width=800;cv.height=H*2;x.setTransform(2,0,0,2,0,0);
sky=x.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#03061a');sky.addColorStop(1,'#1d2a6b');
stars=Array.from({length:70},()=>({x:Math.random()*W,y:Math.random()*H*.85,r:Math.random()*1.4+.4,p:Math.random()*6}));if(st!=='play')by=H/2}
addEventListener('resize',fit);fit();
let spB,spD,spF;
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function buildSprites(){
 if(bi.complete&&bi.naturalWidth){const w=Math.ceil(BH*bi.naturalWidth/bi.naturalHeight*2),h=BH*2;
  spB=mk(w,h);spB.getContext('2d').drawImage(bi,0,0,w,h);
  spD=mk(w,h);const g=spD.getContext('2d');g.translate(w,h);g.rotate(Math.PI);g.drawImage(bi,0,0,w,h)}
 if(fi.complete&&fi.naturalWidth){const d=R*4+8,c=d/2;spF=mk(d,d);const g=spF.getContext('2d');
  g.save();g.beginPath();g.arc(c,c,R*2,0,7);g.clip();g.drawImage(fi,c-R*2,c-R*2,R*4,R*4);g.restore();
  g.lineWidth=5;g.strokeStyle='#ffc83d';g.beginPath();g.arc(c,c,R*2-1,0,7);g.stroke()}}
fi.onload=bi.onload=buildSprites;buildSprites();
function draw(dt){x.fillStyle=sky;x.fillRect(0,0,W,H);
 const tm=performance.now()/600;x.fillStyle='#fff';
 for(const s of stars){x.globalAlpha=.45+.45*Math.sin(tm+s.p);x.fillRect(s.x,s.y,s.r,s.r)}x.globalAlpha=1;
 x.fillStyle='#f4f1d0';x.beginPath();x.arc(330,90,30,0,7);x.fill();x.fillStyle='#0a1236';x.beginPath();x.arc(342,82,27,0,7);x.fill();
 x.fillStyle='rgba(120,140,210,.22)';
 for(const c of clouds){c.x-=c.v*dt;if(c.x<-110)c.x=W+110;x.beginPath();
  x.arc(c.x,c.y,18*c.s,0,7);x.arc(c.x+20*c.s,c.y-9*c.s,22*c.s,0,7);x.arc(c.x+44*c.s,c.y,18*c.s,0,7);x.rect(c.x,c.y,44*c.s,18*c.s);x.fill()}
 const bw=BH*bi.width/bi.height||68;
 if(spB&&spD)for(const p of pipes){if(p.x<-bw||p.x>W+bw)continue;const tb=p.gy+GAP/2,bt=p.gy-GAP/2;
  for(let i=0;i<4;i++){const y1=tb+i*BH;if(y1<H)x.drawImage(spB,p.x-bw/2,y1,bw,BH);
   const y2=bt-i*BH;if(y2>0)x.drawImage(spD,p.x-bw/2,y2-BH,bw,BH)}}
 x.save();x.translate(BX,by);x.rotate(Math.max(-.5,Math.min(.9,bv*.06)));
 if(spF)x.drawImage(spF,-R-2,-R-2,2*R+4,2*R+4);x.restore();
 x.textAlign='center';x.lineJoin='round';x.strokeStyle='rgba(0,0,0,.65)';x.fillStyle='#fff';
 x.font='bold 44px system-ui';x.lineWidth=5;x.strokeText(score,W/2,70);x.fillText(score,W/2,70);
 x.font='14px system-ui';x.lineWidth=3;x.strokeText('Best '+best,W/2,92);x.fillText('Best '+best,W/2,92)}
function loop(n){const dt=Math.min((n-last)/16.67,2.5);last=n;
 if(st==='play')upd(dt);else if(st==='ready'){by=H/2+Math.sin(n/300)*10}
 draw(dt);requestAnimationFrame(loop)}
requestAnimationFrame(loop);
$('go').onclick=e=>{e.stopPropagation();begin()};
cv.addEventListener('pointerdown',e=>{e.preventDefault();flap()});
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();if(st==='play')flap();else if(Date.now()-over>500)begin()}});
$('mb').onclick=e=>{e.stopPropagation();const m=$('mu');m.checked=!m.checked;$('mb').textContent=m.checked?'🔊':'🔇';if(!m.checked){stopMusic();outEl.pause()}else if(st==='play')startMusic()};
document.addEventListener('visibilitychange',()=>{if(document.hidden){stopMusic()}else{last=performance.now();if(st==='play')startMusic()}});
$('b').textContent=best?'Best: '+best:'';
</script></body></html>
